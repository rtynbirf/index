# ═══════════════════════════════════════════════════════════════════════════
# СОН-ПЕРИМЕТРА-0.1 · волна 2026-11-21 · СИНГУЛЯР/СВЯЗЬ · репо INDEX
#
# Зачем: совет района №5 — «живое ядро — singulyar, cell-swarm, index,
# khozyain, release-vault; остальным — СОН, не смерть: автоматы перевести
# на расписание раз в сутки». Раз в сутки сторож тихо обходит весь флот
# (80 репо) через git ls-remote БЕЗ ТОКЕНА и записывает, кто на какой
# голове стоит. Сон — не смерть: «не отвечает» ≠ «умер», сторож фиксирует,
# а не хоронит.
#
# Почему отчёт в АРТЕФАКТ, а не коммитом в репо: у прогона достаточно
# contents: read — флоту не нужно право записи, дрейф не роняет workflow
# (код 0 — дрейф норма), а файл отчёта забирается из артефакта прогона.
# Артефакты Actions живут ~90 дней — для вечной истории отчётов см. шаблон
# коммит-шага в комментарии ниже (тогда включают contents: write).
#
# Честные границы: сторож видит только SHA голов веток. Даты последних
# пушей он не видит — дрейф считается относительно якорей registry/waves.json
# и прошлых отчётов. api.github.com на 80 репо не используется (лимит
# без токена 60/час); git ls-remote лимита не имеет.
# ═══════════════════════════════════════════════════════════════════════════

name: СОН-ПЕРИМЕТРА-0.1

# Ночь по UTC: 21:20. Плюс ручной запуск с вкладки Actions в любой момент.
on:
  schedule:
    - cron: '20 21 * * *'
  workflow_dispatch:

# Минимум прав: сторож только читает чужие репо и выкладывает артефакт
# собственного прогона. Писать в репо ему не нужно.
permissions:
  contents: read

# Ночной обход не должен наслаиваться сам на себя: если прежний ещё идёт,
# новый просто подождёт следующей ночи (cancel-in-progress выключен —
# спящих репо не будят дважды и не бросают на полдороге).
concurrency:
  group: son-perimetra
  cancel-in-progress: false

jobs:
  obhod:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 80 репо × таймаут 15 с — худший случай умещается
    steps:
      # Ступень 1. Код репо index: son/son_perimetra.py + son/fleet.json.
      - uses: actions/checkout@v4

      # Ступень 2. Ночной обход: полный флот из fleet.json, последовательно,
      # таймаут 15 с на репо, без токена. Скрипт сам печатает сводку
      # (сколько совпало / уехало / не отвечает) и суммарное время обхода.
      # Дрейф (УЕХАЛА) — норма автопилота и НЕ роняет ступень; ступень
      # падает только если waves.json недоступен или не ответил ни один репо
      # (код 2 — сверка не состоялась).
      - name: ночной обход флота (80 репо, ls-remote без токена)
        run: python3 son/son_perimetra.py write --out-dir son-otchet/

      # Ступень 3. Отчёт ночи — артефакт прогона (сон-YYYY-MM-DD.json +
      # last.json). if: always() — отчёт нужен и при коде 2, чтобы видеть,
      # кто именно молчал. if-no-files-found: error — пустой сон не молчит.
      - name: положить отчёт в артефакт прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: son-otchet
          path: son-otchet/
          if-no-files-found: error

      # ── Шаблон на будущее: отчёты ПРЯМО в репо ─────────────────────────
      # Если захотят вечную историю ночей в git (а не артефакты на ~90 дней),
      # это делается в два движения:
      #   1) permissions: contents: write  (вместо read);
      #   2) после обхода добавить шаг коммита:
      #
      #      - name: положить отчёт в репо (требует contents: write)
      #        run: |
      #          git config user.name "son-perimetra"
      #          git config user.email "actions@users.noreply.github.com"
      #          git add son-otchet/
      #          git commit -m "сон-периметра: отчёт $(date -u +%F)" || echo "нет изменений"
      #          git push
      #
      # Пока выбран артефакт: право записи целому флоту не нужно, а отчёт
      # всё равно забирается из вкладки Actions каждого ночного прогона.
      # ────────────────────────────────────────────────────────────────────
