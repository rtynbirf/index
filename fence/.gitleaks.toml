# ФЕНС rtynbirf — конфиг gitleaks v8.
# Мир: gitleaks.io, базовые правила детектируют ghp_/github_pat_ и сотни паттернов.
# Эмерджентное: КРЕМАЦИОННЫЙ СПИСОК — конкретные префиксы сожжённых ключей вселенной
# вшиты в правила как шрамы. Их появление в любом байте истории = провал.
# Префикс (не полный ключ!) — это подпись детекции, не секрет: авторизоваться им нельзя,
# а опознать возвращение трупа — можно.
title = "ФЕНС rtynbirf"

[extend]
useDefault = true   # базовые правила gitleaks поверх наших

# ── КРЕМАЦИОННЫЙ СПИСОК ─────────────────────────────────────────────
[[rules]]
id = "cremated-token-2026-11-16"
description = "Ключ кремирован 2026-11-16 (публиковался в чате). Появление = тревога."
regex = '''ghp_ARLy[A-Za-z0-9]{20,}'''
keywords = ["ghp_ARLy"]

[[rules]]
id = "cremated-token-2026-11-19"
description = "Ключ кремирован 2026-11-19 (публиковался в чате). Появление = тревога."
regex = '''ghp_ZeJh[A-Za-z0-9]{20,}'''
keywords = ["ghp_ZeJh"]

# ── Известные ложные срабатывания вселенной ────────────────────────
[allowlist]
description = "audit_account.py держит литерал ghp_ как regex-шаблон ЗАЧИСТКИ (сам ключ берёт из env) — подтверждено аудитом смены 16.11"
paths = ['''(^|/)audit_account\.py$''']
